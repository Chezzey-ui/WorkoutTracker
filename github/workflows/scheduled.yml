name: Daily Script

on:

  # This adds a "Run workflow" button so you can test manually
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          # Your secrets are available as environment variables
          # Add more secrets in Settings > Secrets > Actions
          MY_GENDER: ${{ secrets.MY_GENDER }}
          MY_SHEET_ENDPOINT: ${{ secrets.MY_SHEET_ENDPOINT }}
          MY_API_KEY: ${{ secrets.MY_API_KEY }}
          MY_APP_ID: ${{ secrets.MY_APP_ID }}
          MY_BEARER_TOKEN: ${{ secrets.MY_BEARER_TOKEN }}
          MY_AGE: ${{ secrets.MY_AGE }}
          MY_WEIGHT_KG: ${{ secrets.MY_WEIGHT_KG }}
          MY_HEIGHT_CM: ${{ secrets.MY_HEIGHT_CM }}
        run: python main.py
